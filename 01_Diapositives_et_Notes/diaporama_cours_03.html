          "  - Le robot avance vers l'objet, amorce une rotation autour de lui (*circling*) et s'éloigne si c'est un petit cylindre.",
          "• Mécanisme écologique (Nolfi & Floreano 2000) :",
          "  En tournant autour du cylindre, le mouvement physique transforme un problème complexe en un profil temporel sensoriel évident (les patterns sensoriels d'un petit cylindre en rotation sont radicalement différents de ceux d'un grand cylindre)."
        ],
        raw_text: "Catégoriser dans l’action\nScheier, Pfeifer and Kunyioshi (1998)\nSolution encarnée / située :\n• Pas de couche cachée ni représentation ni apprentissage supervisé\n• Le robot tourne autour de l'objet (circling)\n• 'Sensory patterns when circling a small cylinder are significantly different from those while circling a large one' (Nolfi & Floreano 2000)"
      },
      {
        num: "P16",
        deck: "Poirier",
        category: "CATÉGORISER DANS L'ACTION",
        title: "Catégoriser dans l’action",
        subtitle: "Émergence de la catégorisation par l'action (Scheier et al. 1998)",
        points: [
          "• Courbe évolutive / apprentissage robotique :",
          "  - Au fil des générations, le taux de bonne classification bondit de 0 à plus de 95%.",
          "• Leçon épistémologique fondamentale des sciences cognitives encarnées :",
          "  La catégorisation n'est pas une computation abstraite isolée dans le cerveau ; elle émerge de l'interaction active et physique entre la morphologie du corps, les mouvements dans l'environnement et les flux sensoriels."
        ],
        raw_text: "Catégoriser dans l’action\nScheier, Pfeifer and Kunyioshi (1998)\nSolution encarnée / située\nCourbe de performance atteignant >90-95%\nLa catégorisation émerge de l'action motrice et non d'une représentation cérébrale passive"
      }
    ];

    let currentIdx = 28; // Diapo 29 active par défaut (index 28)
    let showRaw = false;

    function renderSlideSelect() {
      const select = document.getElementById('slideSelect');
      select.innerHTML = slides.map((s, i) => 
        `<option value="${i}" ${i === currentIdx ? 'selected' : ''}>${s.deck ? '[' + s.deck + '] ' : ''}${typeof s.num === 'number' && s.num < 10 ? 'D0' + s.num : 'D' + s.num} - ${(s.subtitle || s.title).substring(0, 26)}...</option>`
      ).join('');
    }

    function renderSlide(idx) {
      if (idx < 0 || idx >= slides.length) return;
      currentIdx = idx;
      const s = slides[currentIdx];

      document.getElementById('slideCounter').textContent = `Diapo ${s.num} / ${slides.length}`;
      document.getElementById('slideSelect').value = currentIdx;

      const container = document.getElementById('slideContent');

      if (showRaw) {
        container.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
              <span class="text-xs font-mono px-2 py-0.5 rounded bg-sky-950 text-sky-300 border border-sky-800">
                Mode Brut Verbatim • Diapo ${s.num} / ${slides.length}
              </span>
              <button onclick="toggleVerbatim()" class="text-xs text-sky-400 hover:text-sky-300 transition">Épuré ↗</button>
            </div>
            <pre class="verbatim-box p-4 rounded-xl text-xs font-mono text-slate-200 overflow-x-auto whitespace-pre-wrap leading-relaxed">${s.raw_text}</pre>
          </div>
        `;
      } else {
        let pointsHtml = s.points.map(p => {
          if (p.startsWith('•')) {
            return `<li class="flex items-start gap-2.5 text-slate-200 text-sm md:text-base leading-relaxed">
              <span class="text-sky-400 mt-1 font-bold text-xs">◆</span>
              <span>${p.substring(1).trim()}</span>
            </li>`;
          } else if (p.startsWith('TABLEAU') || p.startsWith('ÉTAPES') || p.startsWith('TROIS') || p.startsWith('IMPLICATION')) {
            return `<li class="mt-3 mb-1 text-xs font-bold uppercase tracking-wider text-sky-300/90 border-b border-slate-700/60 pb-1">${p}</li>`;
          } else {
            return `<li class="text-slate-300 text-sm md:text-base pl-5 leading-relaxed font-mono bg-slate-900/40 p-1.5 rounded my-1">${p}</li>`;
          }
        }).join('');

        container.innerHTML = `
          <div class="flex flex-col h-full justify-between">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-mono font-bold tracking-wider text-sky-400 uppercase bg-sky-950/70 border border-sky-800/80 px-2 py-0.5 rounded">
                  ${s.category || 'PSY9613'} · D${s.num < 10 ? '0' : ''}${s.num}
                </span>
                <button onclick="toggleVerbatim()" class="text-xs text-slate-400 hover:text-sky-300 transition">Texte brut ↗</button>
              </div>
              <h2 class="text-2xl md:text-3xl font-extrabold text-white mb-2 leading-snug tracking-tight">${s.title}</h2>
              ${s.subtitle ? `<h3 class="text-base md:text-lg font-medium text-sky-300/95 mb-4 leading-relaxed border-l-4 border-sky-500/80 pl-3 py-1">${s.subtitle}</h3>` : ''}
              <div class="mt-4 border-t border-slate-700/60 pt-4">
                <ul class="space-y-2 list-none">
                  ${pointsHtml}
                </ul>
              </div>
            </div>
          </div>
        `;
      }

      document.getElementById('prevBtn').disabled = (currentIdx === 0);
      document.getElementById('nextBtn').disabled = (currentIdx === slides.length - 1);
    }

    let currentZoom = 1.02;
    function adjustZoom(delta) {
      currentZoom = Math.min(2.5, Math.max(0.8, Math.round((currentZoom + delta) * 10) / 10));
      document.getElementById('slideContent').style.zoom = currentZoom;
    }

    function prevSlide() { if (currentIdx > 0) renderSlide(currentIdx - 1); }
    function nextSlide() { if (currentIdx < slides.length - 1) renderSlide(currentIdx + 1); }
    function goToSlide(i) { renderSlide(i); }

    function toggleVerbatim() {
      showRaw = !showRaw;
      const btn = document.getElementById('toggleVerbatimBtn');
      btn.textContent = showRaw ? "🎨 Mode Épuré" : "📄 Mode Brut";
      btn.classList.toggle('bg-sky-900', showRaw);
      btn.classList.toggle('text-sky-200', showRaw);
      renderSlide(currentIdx);
    }

    function filterSlides() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return;
      const foundIdx = slides.findIndex(s => 
        s.title.toLowerCase().includes(q) || 
        (s.subtitle && s.subtitle.toLowerCase().includes(q)) ||
        (s.category && s.category.toLowerCase().includes(q)) ||
        s.raw_text.toLowerCase().includes(q)
      );
      if (foundIdx !== -1) renderSlide(foundIdx);
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
      if (e.key === '/') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    renderSlideSelect();
    renderSlide(44); // Diapo P16 active : Émergence de la performance (>95%) [Fin Deck 2]
  </script>
</body>
</html>
